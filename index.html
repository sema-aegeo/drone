
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa Temático - Registro de Drones</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      background-color: #f2f2f2;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h2 {
      margin-top: 20px;
      font-size: 24px;
      color: #333;
    }

    #container {
      width: 800px;
      margin: 0 auto;
    }

    #map {
      width: 800px;
      height: 600px;
      margin-top: 20px;
      border: 2px solid #ccc;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    /* Ocultar o filtro lateral */
    .filterDiv {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="container">
    <h2>Mapa Temático - Registro de Utilização dos Drones da SEMA</h2>
    <div id="map"></div>
  </div>

  <script src="qgis2web_expressions.js"></script>
  <script src="leaflet.js"></script>
  <script src="leaflet.rotatedMarker.js"></script>
  <script src="leaflet.pattern.js"></script>
  <script src="leaflet-hash.js"></script>
  <script src="leaflet.mouseposition.js"></script>
  <script src="leaflet.measure.js"></script>
  <script src="proj4.js"></script>
  <script src="proj4leaflet.js"></script>
  <script src="control.search.js"></script>
  <script src="layers.js"></script>
  <script src="leaflet.control.geocoder.js"></script>
  <script src="qgis2web.js"></script>
</body>
</html>
